<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Claims | IFAR Portal</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin-common.js"></script></head>
<body class="bg-slate-50 text-slate-800"><header class="bg-[#212F6E] text-white"><div class="max-w-7xl mx-auto px-5 h-16 flex justify-between items-center"><a href="admin-dashboard.html" class="font-bold">← Super Admin</a><div class="flex gap-3 text-xs"><span id="admin-email"></span><button onclick="adminLogout()">Logout</button></div></div></header>
<main class="max-w-7xl mx-auto p-5"><h1 class="text-2xl font-bold">Claim Administration</h1><p class="text-sm text-slate-500">Claims submitted by all IFAR users.</p>
<section class="bg-white border rounded-2xl p-4 mt-5 grid md:grid-cols-4 gap-3"><input id="f-claimant" class="border rounded-xl px-3 py-2" placeholder="Claimant / IFAR name"><input id="f-account" class="border rounded-xl px-3 py-2" placeholder="Account holder name"><input id="f-ref" class="border rounded-xl px-3 py-2" placeholder="Claim reference"><select id="f-status" class="border rounded-xl px-3 py-2"><option value="">All statuses</option><option>SENT_TO_CLAIM_DEPT</option><option>RECEIVED</option><option>RETURNED</option><option>READY</option><option>DRAFT</option></select></section>
<section class="bg-white border rounded-2xl mt-5 overflow-x-auto"><table class="w-full text-sm min-w-[1100px]"><thead class="bg-slate-100 text-left"><tr><th class="p-3">Claim / IFAR</th><th class="p-3">Account Holder</th><th class="p-3">Date</th><th class="p-3">Amount</th><th class="p-3">Status</th><th class="p-3">Return Reason</th><th class="p-3">Actions</th></tr></thead><tbody id="rows"></tbody></table></section><section class="flex flex-wrap items-center justify-between gap-3 mt-3 text-sm"><div class="flex items-center gap-2"><span>Rows per page</span><select id="pageSize" class="border rounded-xl px-2 py-1"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select><span id="rangeInfo" class="text-slate-500"></span></div><div class="flex items-center gap-2"><button id="prevPage" class="border px-3 py-1.5 rounded-lg disabled:opacity-40">Prev</button><span id="pageInfo" class="text-slate-600"></span><button id="nextPage" class="border px-3 py-1.5 rounded-lg disabled:opacity-40">Next</button></div></section></main><div id="admin-toast" class="hidden"></div>
<script>
let claims=[],currentPage=1;
function badge(s){const c=s==='RECEIVED'?'bg-emerald-100 text-emerald-700':s==='RETURNED'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700';return `<span class="${c} px-2 py-1 rounded-full text-xs font-bold">${esc(s)}</span>`}
function filtered(){const n=v=>v.toLowerCase();const a=n(document.getElementById('f-claimant').value),h=n(document.getElementById('f-account').value),r=n(document.getElementById('f-ref').value),s=document.getElementById('f-status').value;return claims.filter(x=>(!a||n(`${x.applicant_name} ${x.adviser_name} ${x.adviser_email}`).includes(a))&&(!h||n(x.account_holder_name||'').includes(h))&&(!r||n(x.claim_ref||'').includes(r))&&(!s||x.status===s))}
function render(){const list=filtered();const pageSize=parseInt(document.getElementById('pageSize').value,10)||20;const totalPages=Math.max(1,Math.ceil(list.length/pageSize));if(currentPage>totalPages)currentPage=totalPages;if(currentPage<1)currentPage=1;const start=(currentPage-1)*pageSize,pageRows=list.slice(start,start+pageSize);
document.getElementById('rows').innerHTML=pageRows.length?pageRows.map(x=>`<tr class="border-t"><td class="p-3"><b>${esc(x.applicant_name||x.adviser_name)}</b><div class="text-xs font-mono">${esc(x.claim_ref)}</div><div class="text-xs text-slate-500">${esc(x.adviser_email)}</div></td><td class="p-3">${esc(x.account_holder_name||'—')}</td><td class="p-3">${adminDate(x.claim_date)}</td><td class="p-3">${adminMoney(x.total_amount)}</td><td class="p-3">${badge(x.status)}</td><td class="p-3 max-w-xs">${esc(x.return_reason||'—')}</td><td class="p-3"><div class="flex gap-2">${x.pdf_path?`<button onclick="pdf('${x.id}')" class="border px-3 py-1.5 rounded-lg">PDF</button>`:''}${x.status==='SENT_TO_CLAIM_DEPT'?`<button onclick="act('${x.id}','receive')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg">Receive</button>`:''}${x.status==='SENT_TO_CLAIM_DEPT'?`<button onclick="act('${x.id}','return')" class="bg-rose-600 text-white px-3 py-1.5 rounded-lg">Return</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="7" class="p-10 text-center text-slate-400">No claims found</td></tr>`;
document.getElementById('rangeInfo').textContent=list.length?`Showing ${start+1}-${Math.min(start+pageSize,list.length)} of ${list.length}`:'Showing 0 of 0';
document.getElementById('pageInfo').textContent=`Page ${currentPage} of ${totalPages}`;
document.getElementById('prevPage').disabled=currentPage<=1;
document.getElementById('nextPage').disabled=currentPage>=totalPages}
function goToPage(p){currentPage=p;render()}
function resetAndRender(){currentPage=1;render()}
async function load(){const q=await supabaseClient.rpc('admin_claim_records');if(q.error){showAdminToast(q.error.message,true);return}claims=q.data||[];render()}
async function pdf(id){const x=claims.find(v=>v.id===id);const q=await supabaseClient.storage.from('claim-pdfs').createSignedUrl(x.pdf_path,120);if(q.error)return showAdminToast(q.error.message,true);window.open(q.data.signedUrl,'_blank','noopener')}
async function act(id,action){let reason='';if(action==='return'){reason=prompt('Enter the reason for returning this claim:')?.trim()||'';if(!reason)return showAdminToast('A return reason is required.',true)}if(!confirm(`${action==='receive'?'Receive':'Return'} this claim?`))return;const q=await supabaseClient.functions.invoke('admin-portal-action',{body:{mode:`claim_${action}`,claimId:id,reason}});if(q.error||!q.data?.success)return showAdminToast(q.data?.error||q.error?.message||'Action failed.',true);showAdminToast(`Claim ${action==='receive'?'received':'returned'} and IFAR notified.`);await load()}
['f-claimant','f-account','f-ref','f-status'].forEach(id=>document.getElementById(id).addEventListener('input',resetAndRender));document.getElementById('pageSize').addEventListener('input',resetAndRender);document.getElementById('prevPage').addEventListener('click',()=>goToPage(currentPage-1));document.getElementById('nextPage').addEventListener('click',()=>goToPage(currentPage+1));(async()=>{if(await requireSuperAdmin())await load()})();
</script></body></html>
