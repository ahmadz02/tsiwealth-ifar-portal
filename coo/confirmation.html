<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Wealth Planners - Client Confirmation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .brand-navy { color:#212F6E; }
  .bg-brand-navy { background-color:#212F6E; }
  .bg-brand-gold { background-color:#FFCB08; }
  .sig-canvas { touch-action:none; cursor:crosshair; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<header class="bg-brand-navy text-white shadow-md">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-3">
    <div class="bg-white/10 p-2 rounded-lg text-yellow-300"><i class="fa-solid fa-file-signature text-xl"></i></div>
    <div>
      <h1 class="font-bold text-lg leading-none">TSI Wealth Planners</h1>
      <span class="text-xs text-slate-300">Secure Takaful Confirmation</span>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
  <div id="page-state" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center">
    <i class="fa-solid fa-circle-notch fa-spin text-2xl brand-navy"></i>
    <p class="text-sm text-slate-500 mt-3">Loading your confirmation...</p>
  </div>
  <div id="confirmation-card" class="hidden bg-white rounded-2xl border border-slate-200 shadow-md p-6 sm:p-10 space-y-6"></div>
</main>

<div id="toast-container" class="fixed top-4 right-4 z-50 max-w-sm"></div>

<script>
const COMPANY_ADDRESS = 'D-20-3A, Menara SuezCap 1, No.2, Jalan Kerinchi, Gerbang Kerinchi Lestari, 59200, Kuala Lumpur';
const COMPANY_CONTACT = 'Tel : (603) 2303 1987   |   Email: admin@tsiwealth.com   |   Website: www.tsiwealth.com.my';
let clientSigCanvas = null;
let clientSigCtx = null;
let isDrawing = false;
let currentConfirmation = null;
const token = new URLSearchParams(window.location.search).get('token');

window.addEventListener('DOMContentLoaded', loadConfirmation);

async function loadConfirmation() {
  if (!token) return showFatal('Invalid confirmation link', 'The secure token is missing from this link.');

  const { data, error } = await supabaseClient.rpc('get_confirmation_by_token', { p_token: token });
  if (error) {
    console.error(error);
    return showFatal('Unable to open confirmation', 'The link is invalid, expired, or the confirmation service is unavailable.');
  }
  if (!data || data.length === 0) return showFatal('Confirmation not found', 'This secure confirmation link is not valid.');

  currentConfirmation = data[0];
  renderConfirmation();
}

function renderConfirmation() {
  const doc = currentConfirmation;
  document.getElementById('page-state').classList.add('hidden');
  const card = document.getElementById('confirmation-card');
  card.classList.remove('hidden');

  const signed = doc.status !== 'AWAITING_CLIENT' || !!doc.client_signature;
  const operators = Array.isArray(doc.operators) ? doc.operators : [];
  const operatorRows = operators.map((op, i) => `
    <div class="flex items-center justify-between px-4 py-3 border border-slate-200 rounded-lg bg-slate-50">
      <span class="text-sm text-slate-700"><span class="text-slate-400 mr-2">${i + 1}.</span>${escapeHtml(op)}</span>
      <i class="fa-solid fa-square-check brand-navy"></i>
    </div>`).join('');

  card.innerHTML = `
    <div class="border-b border-slate-100 pb-6">
      <p class="text-xs font-bold tracking-widest uppercase text-amber-600">Client Confirmation</p>
      <h2 class="text-xl font-bold text-slate-900 mt-1">Confirmation of Recommended Solutions</h2>
      <p class="text-xs text-slate-500 mt-1">Reference: ${escapeHtml(doc.reference_no)}</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
        <p class="text-xs text-slate-400 uppercase font-semibold">Name of Participant</p>
        <p class="text-sm font-bold text-slate-800 mt-0.5">${escapeHtml(doc.participant_name)}</p>
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
        <p class="text-xs text-slate-400 uppercase font-semibold">Certificate No.</p>
        <p class="text-sm font-bold text-slate-800 mt-0.5">${escapeHtml(doc.certificate_no)}</p>
      </div>
    </div>

    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs text-slate-600 leading-relaxed">
      I acknowledge that the adviser has presented the following Takaful operators for my consideration in relation to my application.
    </div>

    <div class="space-y-2">${operatorRows}</div>

    ${doc.remarks ? `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3"><p class="text-xs text-slate-400 uppercase font-semibold">Remarks</p><p class="text-sm text-slate-700 mt-1">${escapeHtml(doc.remarks)}</p></div>` : ''}

    <div class="border border-slate-200 rounded-xl p-4">
      <p class="text-xs font-semibold text-slate-500 uppercase mb-3">Participant Confirmation & Signature</p>
      ${signed ? `
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
          <div class="flex items-center gap-2 text-emerald-700 font-semibold text-sm"><i class="fa-solid fa-circle-check"></i> Confirmation submitted</div>
          ${doc.client_signature ? `<img src="${doc.client_signature}" class="h-20 mt-3 border-b border-emerald-200" alt="Participant signature">` : ''}
          <p class="text-xs text-emerald-700/70 mt-2">Signed ${doc.client_signed_at ? new Date(doc.client_signed_at).toLocaleString('en-MY') : ''}</p>
        </div>` : `
        <p class="text-xs text-slate-500 mb-3">By signing below, I confirm the selection information shown above.</p>
        <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl relative">
          <canvas id="client-sig-canvas" class="sig-canvas w-full" style="height:112px"></canvas>
          <span id="client-sig-placeholder" class="absolute inset-0 flex items-center justify-center text-slate-300 text-xs pointer-events-none">Sign here</span>
        </div>
        <div class="flex justify-between items-center mt-3">
          <button type="button" onclick="clearSignature()" class="text-xs text-slate-500 hover:text-rose-600 font-medium"><i class="fa-solid fa-eraser mr-1"></i>Clear</button>
          <button type="button" id="submit-signature-btn" onclick="submitSignature()" class="px-5 py-2.5 rounded-xl bg-brand-navy text-white text-sm font-medium shadow-sm"><i class="fa-solid fa-paper-plane mr-1"></i> Confirm & Submit</button>
        </div>`}
    </div>

    <div class="pt-4 border-t border-slate-100 text-[11px] text-slate-400 leading-relaxed">
      <p class="font-semibold text-slate-500">TSI Wealth Planners</p>
      <p>${COMPANY_ADDRESS}</p>
      <p>${COMPANY_CONTACT}</p>
      <p class="mt-2">Adviser / FAR: ${escapeHtml(doc.adviser_name)}</p>
    </div>`;

  if (!signed) setTimeout(initCanvas, 50);
}

function initCanvas() {
  clientSigCanvas = document.getElementById('client-sig-canvas');
  if (!clientSigCanvas) return;
  clientSigCtx = clientSigCanvas.getContext('2d');
  const rect = clientSigCanvas.getBoundingClientRect();
  clientSigCanvas.width = Math.max(1, Math.floor(rect.width));
  clientSigCanvas.height = 112;
  clientSigCtx.lineWidth = 2.5;
  clientSigCtx.lineCap = 'round';
  clientSigCtx.strokeStyle = '#1e1b4b';

  const pos = e => {
    const r = clientSigCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = e => { isDrawing = true; document.getElementById('client-sig-placeholder').style.display = 'none'; const p=pos(e); clientSigCtx.beginPath(); clientSigCtx.moveTo(p.x,p.y); };
  const draw = e => { if (!isDrawing) return; e.preventDefault(); const p=pos(e); clientSigCtx.lineTo(p.x,p.y); clientSigCtx.stroke(); };
  const stop = () => { isDrawing = false; };
  clientSigCanvas.addEventListener('mousedown', start);
  clientSigCanvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stop);
  clientSigCanvas.addEventListener('touchstart', start, {passive:false});
  clientSigCanvas.addEventListener('touchmove', draw, {passive:false});
  window.addEventListener('touchend', stop);
}

function clearSignature() {
  if (!clientSigCanvas) return;
  clientSigCtx.clearRect(0, 0, clientSigCanvas.width, clientSigCanvas.height);
  const p = document.getElementById('client-sig-placeholder');
  if (p) p.style.display = 'flex';
}

function isCanvasBlank(canvas) {
  const blank = document.createElement('canvas');
  blank.width = canvas.width;
  blank.height = canvas.height;
  return canvas.toDataURL() === blank.toDataURL();
}

async function submitSignature() {
  if (!clientSigCanvas || isCanvasBlank(clientSigCanvas)) return showToast('Please sign before submitting.', 'error');
  const btn = document.getElementById('submit-signature-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Submitting...';

  const signature = clientSigCanvas.toDataURL('image/png');
  const { data, error } = await supabaseClient.rpc('submit_client_confirmation', { p_token: token, p_signature: signature });
  if (error) {
    console.error(error);
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-1"></i> Confirm & Submit';
    return showToast(error.message || 'Unable to submit confirmation.', 'error');
  }
  if (!data) return showFatal('Already submitted', 'This confirmation has already been submitted or is no longer awaiting your signature.');

  showToast('Confirmation submitted successfully.');
  await loadConfirmation();
}

function showFatal(title, message) {
  document.getElementById('confirmation-card').classList.add('hidden');
  const el = document.getElementById('page-state');
  el.classList.remove('hidden');
  el.innerHTML = `<div class="w-12 h-12 mx-auto rounded-full bg-rose-50 text-rose-500 flex items-center justify-center"><i class="fa-solid fa-link-slash"></i></div><h2 class="text-lg font-bold text-slate-800 mt-4">${escapeHtml(title)}</h2><p class="text-sm text-slate-500 mt-1">${escapeHtml(message)}</p>`;
}

function showToast(message, type='success') {
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-xl shadow-xl text-xs font-semibold ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'} text-white`;
  el.textContent = message;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]));
}
</script>
</body>
</html>
